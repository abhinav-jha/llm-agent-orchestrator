[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-orchestrator"
version = "0.1.0"
description = "A FastAPI backend for tool-calling AI agents with semantic memory."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "bcrypt>=4.0.1,<4.1",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<0.116",
    "httpx>=0.28,<1",
    "openai>=1.59,<2",
    "passlib[bcrypt]>=1.7.4,<2",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
